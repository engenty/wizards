# One wizard as a Worker, each run a Durable Object. Local only: `pnpm dev` (wrangler dev).
name = "wizard-x-post"
main = "dist/worker.js"
compatibility_date = "2025-09-01"
# build.mjs bundles the kernel, wizard.json and the step files itself.
no_bundle = true

[build]
command = "node build.mjs"

[[durable_objects.bindings]]
name = "RUNS"
class_name = "RunObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RunObject"]

# The model classes in `requires.models`, as models of the endpoint. MODEL_API_KEY is a secret
# (.dev.vars locally); without it the agent battery echoes.
[vars]
MODEL_BASE_URL = "https://api.openai.com/v1"
MODELS = '{"low":"gpt-4.1-mini","image":"gpt-4.1-mini"}'
