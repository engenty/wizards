# git-cliff configuration — drives `pnpm release`.
# Compact changelog: `- ADDED **[scope]** description` when the commit has a scope;
# `- ADDED description` when it does not. See docs/development.md#releases-and-changelog.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to engenty wizards. Generated from [Conventional Commits](https://www.conventionalcommits.org/)
by [git-cliff](https://git-cliff.org) via `pnpm release`. Pre-`1.0`: a **minor**
bump is a notable or breaking change, **patch** is fixes and small features.
"""
# One release block. `version` is set when rendering a tagged release,
# absent for the unreleased preview.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% for commit in commits %}\
- {{ group | upper }}{% if commit.scope %} **[{{ commit.scope }}]**{% endif %} {{ commit.message | upper_first | trim }}\
{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Keep unconventional commits instead of dropping them silently: anything meaningful that
# forgets the convention lands in "Other" rather than vanishing.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "newest"
# A subject that runs on into a second line, with no blank line between, is read as one line:
# otherwise it does not parse as a conventional commit and shows with its type and a line break.
commit_preprocessors = [
  { pattern = '^([^\n]+)\n([^\n]+)', replace = "$1 $2" },
]
# Commit types → changelog groups. First match wins; the trailing `.*` catches the rest.
commit_parsers = [
  # Dropped on purpose.
  { message = "^Merge ", skip = true },
  { message = "^(chore|ci|test|build|style)(\\(.*\\))?!?:", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^deploy", group = "Deploy" },
  { message = "^docs", group = "Docs" },
  { message = ".*", group = "Other" },
]

[bump]
# Pre-1.0: breaking changes bump minor (not major), features bump patch.
# release.mjs lets you override the level anyway.
features_always_bump_minor = false
breaking_always_bump_major = false
