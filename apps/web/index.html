<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="wizards" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>engenty wizards</title>
    <script>
      // Before first paint, so a dark visitor never sees the light page flash.
      try {
        // The pick shared with the account pages (engenty_theme) wins over this host's own.
        const shared = /(?:^|;\s*)engenty_theme=(light|dark|system)(?:;|$)/.exec(document.cookie);
        const pick = shared ? shared[1] : localStorage.getItem("wizards.theme");
        if (pick === "dark" || !pick || (pick === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').content = "#1c2a63";
        }
      } catch {}
      // Chrome offers "install" once, early; the offer is kept until the person asks for it.
      addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.wizardInstall = e;
        dispatchEvent(new Event("wizard-install"));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
