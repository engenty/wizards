<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" style="--w:680px" role="img">
<title>Studio, Work and Client look at one space</title>
<rect x="40" y="20" width="180" height="72" rx="10" class="d-box"/>
<path d="M130,92 L130.0,134.0" class="d-line"/>
<rect x="250" y="20" width="180" height="72" rx="10" class="d-key"/>
<path d="M340,92 L340.0,134.0" class="d-line"/>
<rect x="460" y="20" width="180" height="72" rx="10" class="d-box"/>
<path d="M550,92 L550.0,134.0" class="d-line"/>
<rect x="40" y="140" width="600" height="64" rx="10" class="d-box"/>
<text x="130.0" y="44.0" class="d-t" text-anchor="middle">Studio</text>
<text x="130.0" y="60.5" class="d-s" text-anchor="middle">build wizards</text>
<text x="130.0" y="76.5" class="d-s" text-anchor="middle">those who build</text>
<polygon points="130,140 125.5,131.0 134.5,131.0" class="d-head"/>
<text x="340.0" y="44.0" class="d-t" text-anchor="middle">Work</text>
<text x="340.0" y="60.5" class="d-s" text-anchor="middle">chats with the space’s AI</text>
<text x="340.0" y="76.5" class="d-s" text-anchor="middle">everyone in the organization</text>
<polygon points="340,140 335.5,131.0 344.5,131.0" class="d-head"/>
<text x="550.0" y="44.0" class="d-t" text-anchor="middle">Client</text>
<text x="550.0" y="60.5" class="d-s" text-anchor="middle">what your clients see</text>
<text x="550.0" y="76.5" class="d-s" text-anchor="middle">comes soon</text>
<polygon points="550,140 545.5,131.0 554.5,131.0" class="d-head"/>
<text x="340.0" y="168.0" class="d-t" text-anchor="middle">The space</text>
<text x="340.0" y="184.5" class="d-s" text-anchor="middle">knowledge, data, files, skills, connections, results</text>
