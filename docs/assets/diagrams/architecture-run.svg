<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 396" style="--w:690px" role="img">
<title>A run from a wizard’s link, across the processes</title>
<rect x="40.0" y="16" width="120" height="40" rx="10" class="d-box"/>
<line x1="100" y1="56" x2="100" y2="380" class="d-life"/>
<rect x="170.0" y="16" width="120" height="40" rx="10" class="d-box"/>
<line x1="230" y1="56" x2="230" y2="380" class="d-life"/>
<rect x="300.0" y="16" width="120" height="40" rx="10" class="d-box"/>
<line x1="360" y1="56" x2="360" y2="380" class="d-life"/>
<rect x="430.0" y="16" width="120" height="40" rx="10" class="d-box"/>
<line x1="490" y1="56" x2="490" y2="380" class="d-life"/>
<rect x="560.0" y="16" width="120" height="40" rx="10" class="d-box"/>
<line x1="620" y1="56" x2="620" y2="380" class="d-life"/>
<path d="M100,96 L224.0,96.0" class="d-line"/>
<path d="M230,138 L614.0,138.0" class="d-line"/>
<path d="M230,180 L354.0,180.0" class="d-line"/>
<path d="M490,222 L366.0,222.0" class="d-line"/>
<path d="M490,264 L614.0,264.0" class="d-line"/>
<path d="M620,306 L236.0,306.0" class="d-line d-dash"/>
<path d="M230,348 L106.0,348.0" class="d-line d-dash"/>
<text x="100.0" y="40.0" class="d-t" text-anchor="middle">Person</text>
<text x="230.0" y="40.0" class="d-t" text-anchor="middle">doors</text>
<text x="360.0" y="40.0" class="d-t" text-anchor="middle">Control DB</text>
<text x="490.0" y="40.0" class="d-t" text-anchor="middle">runner</text>
<text x="620.0" y="40.0" class="d-t" text-anchor="middle">Tenant DB</text>
<polygon points="230,96 221.0,100.5 221.0,91.5" class="d-head"/>
<text x="165.0" y="89" class="d-el" text-anchor="middle">starts a run</text>
<circle cx="14" cy="96" r="9" class="d-n"/><text x="14" y="100" class="d-nt" text-anchor="middle">1</text>
<polygon points="620,138 611.0,142.5 611.0,133.5" class="d-head"/>
<text x="425.0" y="131" class="d-el" text-anchor="middle">the run and its grant</text>
<circle cx="14" cy="138" r="9" class="d-n"/><text x="14" y="142" class="d-nt" text-anchor="middle">2</text>
<polygon points="360,180 351.0,184.5 351.0,175.5" class="d-head"/>
<text x="295.0" y="173" class="d-el" text-anchor="middle">puts it in line</text>
<circle cx="14" cy="180" r="9" class="d-n"/><text x="14" y="184" class="d-nt" text-anchor="middle">3</text>
<polygon points="360,222 369.0,217.5 369.0,226.5" class="d-head"/>
<text x="425.0" y="215" class="d-el" text-anchor="middle">claims it, heartbeat</text>
<circle cx="14" cy="222" r="9" class="d-n"/><text x="14" y="226" class="d-nt" text-anchor="middle">4</text>
<polygon points="620,264 611.0,268.5 611.0,259.5" class="d-head"/>
<text x="555.0" y="257" class="d-el" text-anchor="middle">steps, events, results</text>
<circle cx="14" cy="264" r="9" class="d-n"/><text x="14" y="268" class="d-nt" text-anchor="middle">5</text>
<polygon points="230,306 239.0,301.5 239.0,310.5" class="d-head"/>
<text x="425.0" y="299" class="d-el" text-anchor="middle">changes, within a second</text>
<circle cx="14" cy="306" r="9" class="d-n"/><text x="14" y="310" class="d-nt" text-anchor="middle">6</text>
<polygon points="100,348 109.0,343.5 109.0,352.5" class="d-head"/>
<text x="165.0" y="341" class="d-el" text-anchor="middle">next page, result</text>
<circle cx="14" cy="348" r="9" class="d-n"/><text x="14" y="352" class="d-nt" text-anchor="middle">7</text>
</svg>
