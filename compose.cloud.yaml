# The cloud runtime of a Manage-App, one image in three roles (docs/plans/runner-process.md):
# the studio (`runtime`: authoring, sign-in, MCP, the studio's pages), the doors (`doors`: the
# wizards' pages, their API, shared results) and the runner (executes the runs), plus a separate
# Chromium container. The control database lives on Turso, files in an S3 bucket. The tenant
# databases are files under /data while the Manage-App's TENANT_DB_PROVISIONER is `none`: the
# three roles share that one volume, or each would see a tenant of its own. The sandbox (agentOS, the
# shell and code tool) runs in a container of its own that only the runner reaches.
# Put a TLS proxy (Coolify/Traefik) in front of port 8891 of `runtime` and `doors` (their label
# names the proxy's network, `coolify`, Coolify's); on one host
# the doors take `/w`, `/s`, `/api/public`, `/api/runs`, `/api/shares`, `/embed.js`, `/sw.js` and
# the app links under `/.well-known`, the studio the rest (`/studio`, `/api`, `/install.sh`,
# `/.well-known/oauth-protected-resource`). Both answer under APP_URL; PUBLIC_URL is for doors on
# an origin of their own.
#
# The server builds nothing: the images are built from apps/runtime/Dockerfile,
# deploy/Dockerfile.browser and deploy/Dockerfile.sandbox on GitHub's runners for every release (.github/workflows/ci.yml, job
# `images`) and pulled from GHCR. They serve the studio at an origin's root. IMAGE_TAG pins a
# release (`v0.2.8`); without it the newest green release runs.
services:
  runtime:
    image: ghcr.io/engenty/engenty-wizards-runtime:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:?the public https origin}
      MANAGE_URL: ${MANAGE_URL:?the Manage-App}
      GATEWAY_URL: ${GATEWAY_URL:?the model-gateway}
      API_HOST: 0.0.0.0
      RUNTIME_ROLE: studio
      HEALTH_WATCHDOG: "1"
      # No shell/code tool in the cloud: runs get a browser context, never a sandbox.
      SANDBOX: "off"
      # Chromium answers DevTools requests only under an IP address or localhost.
      BROWSER_CDP_URL: http://172.30.5.10:9222
    volumes:
      # The tenant databases (while they are files) and parsed-document caches; shared by the roles.
      - runtime-cache:/data
    networks:
      default:
      # Coolify drops a network that has no settings (`browser:` alone): an address keeps it.
      browser:
        ipv4_address: 172.30.5.11
    depends_on:
      - browser
    labels:
      # The proxy reaches the container on its own network, never on `browser`: with several
      # networks Traefik takes any of them, per route, and an address on `browser` it cannot
      # reach answers nothing. Written out: Coolify escapes `$` in labels, so a variable here
      # reaches Traefik as its own name, a network that doesn't exist.
      - traefik.docker.network=coolify
    # Coolify and Traefik see a process that stopped answering, instead of "running".
    healthcheck:
      # Unhealthy only when this process hangs (its `process` check, apps/runtime/src/health.ts):
      # a dependency that is down leaves it healthy, a restart wouldn't bring that back.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8891/api/health/ready',{signal:AbortSignal.timeout(4000)}).then((r) => r.json()).then((b) => process.exit(b.checks.process === 'down' ? 1 : 0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The wizards' pages and their API, for the customers: no authoring, no sign-in, no MCP.
  doors:
    image: ghcr.io/engenty/engenty-wizards-runtime:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:?the public https origin}
      MANAGE_URL: ${MANAGE_URL:?the Manage-App}
      GATEWAY_URL: ${GATEWAY_URL:?the model-gateway}
      API_HOST: 0.0.0.0
      RUNTIME_ROLE: doors
      HEALTH_WATCHDOG: "1"
      SANDBOX: "off"
      BROWSER_CDP_URL: http://172.30.5.10:9222
    volumes:
      - runtime-cache:/data
    networks:
      default:
      browser:
        ipv4_address: 172.30.5.12
    depends_on:
      - browser
    labels:
      # The proxy reaches the container on its own network, never on `browser`: with several
      # networks Traefik takes any of them, per route, and an address on `browser` it cannot
      # reach answers nothing. Written out: Coolify escapes `$` in labels, so a variable here
      # reaches Traefik as its own name, a network that doesn't exist.
      - traefik.docker.network=coolify
    # Coolify and Traefik see a process that stopped answering, instead of "running".
    healthcheck:
      # Unhealthy only when this process hangs (its `process` check, apps/runtime/src/health.ts):
      # a dependency that is down leaves it healthy, a restart wouldn't bring that back.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8891/api/health/ready',{signal:AbortSignal.timeout(4000)}).then((r) => r.json()).then((b) => process.exit(b.checks.process === 'down' ? 1 : 0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Outside clients: the MCP server and the API (docs/plans/modular.md), so AI apps and programs
  # scale and fail apart from the studio. The proxy sends it /api/mcp, /api/v1 and
  # /.well-known/oauth-protected-resource; until those routes are set, the studio answers them.
  api:
    image: ghcr.io/engenty/engenty-wizards-runtime:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:?the public https origin}
      MANAGE_URL: ${MANAGE_URL:?the Manage-App}
      GATEWAY_URL: ${GATEWAY_URL:?the model-gateway}
      API_HOST: 0.0.0.0
      RUNTIME_ROLE: api
      HEALTH_WATCHDOG: "1"
      SANDBOX: "off"
    volumes:
      - runtime-cache:/data
    labels:
      - traefik.docker.network=coolify
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8891/api/health/ready',{signal:AbortSignal.timeout(4000)}).then((r) => r.json()).then((b) => process.exit(b.checks.process === 'down' ? 1 : 0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Executes the runs the web puts in line (docs/plans/runner-process.md). Not reachable from
  # outside; the web asks it for a run's browser screen under RUNNER_URL.
  runner:
    image: ghcr.io/engenty/engenty-wizards-runtime:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:?the public https origin}
      MANAGE_URL: ${MANAGE_URL:?the Manage-App}
      GATEWAY_URL: ${GATEWAY_URL:?the model-gateway}
      API_HOST: 0.0.0.0
      RUNTIME_ROLE: runner
      RUNNER_URL: http://runner:8891
      # The runs this runner drives at once; the rest stay in line.
      RUNNER_MAX_RUNS: ${RUNNER_MAX_RUNS:-4}
      # The longest a step may work, in minutes, by step type; empty keeps the defaults.
      RUNNER_STEP_DEADLINES: ${RUNNER_STEP_DEADLINES:-}
      HEALTH_WATCHDOG: "1"
      # An outside monitor's heartbeat address: it alerts when the runner stops pinging.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      SANDBOX: "off"
      # The shell and code tool in the `sandbox` container (docs/plans/agentos-sandbox.md, "The
      # cloud"). On: these four lines instead of SANDBOX "off" above, and the same SANDBOX_SECRET on
      # the `sandbox` service. SANDBOX_GUESTS gives a guest's run (a visitor's, a channel's) one too.
      # SANDBOX: agentos-remote
      # SANDBOX_URL: http://172.30.6.13:8892
      # SANDBOX_SECRET: ${SANDBOX_SECRET:?32 characters or more, the same on the sandbox}
      # SANDBOX_GUESTS: agentos-remote
      BROWSER_CDP_URL: http://172.30.5.10:9222
    volumes:
      - runtime-cache:/data
    networks:
      default:
      browser:
        ipv4_address: 172.30.5.13
      sandbox:
        ipv4_address: 172.30.6.10
    depends_on:
      - browser
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8891/api/health/ready',{signal:AbortSignal.timeout(4000)}).then((r) => r.json()).then((b) => process.exit(b.checks.process === 'down' ? 1 : 0), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # A team's host (docs/plans/org-page.md, docs/plans/client-portal.md): its public pages, and a
  # firm's clients at `<team>.wizards.page/portal`. Its own app on its own image: it asks the
  # Manage-App for the page by host, signs clients in through it and reaches the runtime only over
  # HTTP, the client contract at the `api` service and a run's own routes at the doors. The proxy
  # sends it every `*.wizards.page` host (the bare domain and `www.` stay the Manage-App's, which
  # sends them to engenty.ai) and PORTAL_URL's host. The Manage-App's
  # RUNTIMES entry names `portalUrl` and `portalSecret` (= PORTAL_CLIENT_SECRET).
  portal:
    image: ghcr.io/engenty/engenty-wizards-portal:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      PORTAL_URL: ${PORTAL_URL:?the portal's own https origin, where the sign-in comes back}
      MANAGE_URL: ${MANAGE_URL:?the Manage-App}
      RUNTIME_URL: ${APP_URL:?the public https origin}
      RUNTIME_API_URL: http://api:8891
      RUNTIME_DOORS_URL: http://doors:8891
      PORTAL_CLIENT_ID: ${PORTAL_CLIENT_ID:-wizards-portal-cloud}
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:?the portal's client secret at the Manage-App}
      PORTAL_SECRET: ${PORTAL_SECRET:?32 characters or more, seals the session cookie}
    depends_on:
      - api
      - doors
    labels:
      - traefik.docker.network=coolify

  browser:
    image: ghcr.io/engenty/engenty-wizards-browser:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    shm_size: 1gb
    mem_limit: 3g
    networks:
      browser:
        ipv4_address: 172.30.5.10
    # No curl in the image: bash asks Chromium's DevTools port itself (HTTP/1.1: it answers no 1.0).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q Browser <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # agentOS for the runner's runs (deploy/Dockerfile.sandbox, apps/sandbox): one VM per run, at
  # most SANDBOX_MAX_VMS at once. On its own network with the runner and nothing else: no
  # databases, no other container, no volume, no secret but the one it shares with the runner.
  # Outbound it reaches the internet; the host's firewall keeps it off the host and the private
  # networks (docs/plans/agentos-sandbox.md, "The cloud").
  sandbox:
    image: ghcr.io/engenty/engenty-wizards-sandbox:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      # Until the runner's SANDBOX is switched on, a placeholder: the API answers nobody.
      SANDBOX_SECRET: ${SANDBOX_SECRET:-}
      SANDBOX_MAX_VMS: ${SANDBOX_MAX_VMS:-4}
      SANDBOX_IDLE_MINUTES: ${SANDBOX_IDLE_MINUTES:-30}
    user: "1000:1000"
    read_only: true
    # The VMs live in the helper's memory; /tmp is for what the helper and Node write.
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    # About 400 MB for agentOS's helper, up to 900 MB for a VM with pandas.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2
    pids_limit: 512
    networks:
      sandbox:
        ipv4_address: 172.30.6.13

networks:
  browser:
    ipam:
      config:
        - subnet: 172.30.5.0/24
  # The runner and the sandbox. Its bridge has a fixed name, so the host's firewall can hold it to
  # the internet (docs/plans/agentos-sandbox.md, "The cloud").
  sandbox:
    driver_opts:
      com.docker.network.bridge.name: br-wz-sandbox
    ipam:
      config:
        - subnet: 172.30.6.0/24

volumes:
  runtime-cache:
