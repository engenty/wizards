name: Release

# A tag `v<version>` (the version of the root package.json) publishes what a local install is made
# of on the GitHub release: the runtime, the npm package @engenty/wizards-runtime, as a tarball
# (and the launcher `wizards` and the package `@engenty/wizards` beside it). The installer
# (apps/web/public/install.sh) fetches the runtime from there. People install the studio as a Chrome app. The installer itself reaches
# engenty.ai with the deploy the same tag starts (ci.yml).
#
# The packages also go to npm while the repository variable PUBLISH_NPM is `true` and the secret
# NPM_TOKEN holds a token that may publish `wizards`, `@engenty/wizards-runtime` and
# `@engenty/wizards` without a second factor: the runtime for the updates and the launcher, then
# the launcher for `npx wizards`, then what code outside the repo imports (scripts/npm-package.mjs).
# Run by hand (workflow_dispatch), it builds and tests everything and publishes nothing. On a pull
# request that touches what a local install is made of it does the same, except that the Mac
# helper, the package and the installers run only when what the installers test changes (the job
# `changes`); the tag runs them all before it publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    # `closed` starts a run that does nothing but cancel the PR's runs still going (concurrency).
    types: [opened, synchronize, reopened, closed]
    paths:
      - apps/runtime/**
      - apps/web/public/install.sh
      - apps/web/public/install.ps1
      - packages/**
      - bin/**
      - scripts/npm-package.mjs
      - scripts/build-agent-plugins.mjs
      - plugin/**
      - scripts/export-templates.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request, or its merge, cancels the PR's run still going. Tags and runs by
# hand each get a group of their own and are never cancelled.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a pull request changed. `installer` is true for a tag and a run by hand; on a pull request
  # only when one of these changed:
  #   install.sh, install.ps1    the installers themselves
  #   bin/**                     the launcher `npx wizards` and the command `wizards`, both packed
  #   scripts/npm-package.mjs    how the three packages are staged and packed
  #   apps/runtime/package.json, packages/*/package.json, pnpm-lock.yaml, pnpm-workspace.yaml
  #                              the dependencies the runtime package lists and bundles; a version
  #                              bump of the root package.json (every release PR) is not one
  #   apps/runtime/apple/**, apps/runtime/scripts/build-apple.mjs
  #                              the Mac helper the package carries
  #   release.yml                this workflow
  # Runtime and studio code reach the package as `pnpm build` leaves it, which ci.yml builds and
  # tests on every pull request.
  changes:
    # The run a merge starts only cancels: every job needs this one and skips with it.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      installer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.installer == 'true' }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            installer:
              - apps/web/public/install.sh
              - apps/web/public/install.ps1
              - bin/**
              - scripts/npm-package.mjs
              - apps/runtime/package.json
              - packages/*/package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - apps/runtime/apple/**
              - apps/runtime/scripts/build-apple.mjs
              - .github/workflows/release.yml

  # Apple Intelligence as a model (apps/runtime/src/harness/apple.ts) runs through a Swift helper
  # that only a Mac with the macOS 26 SDK builds; the package made on Linux takes it from here.
  apple:
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build wizards-apple
        run: node apps/runtime/scripts/build-apple.mjs --force
      - uses: actions/upload-artifact@v7
        with:
          name: apple-helper
          path: apps/runtime/dist/apple/wizards-apple
          if-no-files-found: error

  package:
    needs: [changes, apple]
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-helper
          path: dist/apple-helper
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Pack
        run: node scripts/npm-package.mjs --apple dist/apple-helper/wizards-apple

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: dist/npm/*.tgz
          if-no-files-found: error

  # The marketplace's templates as `.wizard` packages with their standalone fit: what the
  # WordPress plugin ships for sites without an account (its release workflow takes the ones
  # that run there as they are). Nothing of an account is needed.
  templates:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm templates:export
      - name: The templates as one archive
        run: (cd dist && tar -czf templates.tgz templates)
      - uses: actions/upload-artifact@v7
        with:
          name: templates
          path: dist/templates.tgz
          if-no-files-found: error

  # The runner package as a host without this repository takes it: the WordPress plugin's
  # release vendors it (packages/runner/README.md).
  runner:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @engenty/wizards-runner build
      - name: The runner as one archive
        run: mkdir -p dist && (cd packages/runner && tar -czf ../../dist/runner.tgz dist LICENSE README.md package.json)
      - uses: actions/upload-artifact@v7
        with:
          name: runner
          path: dist/runner.tgz
          if-no-files-found: error

  # The plugin for the AI apps' marketplaces (scripts/build-agent-plugins.mjs), with engenty.ai's
  # server bundled. A tag puts it into the public repository engenty/wizards-plugins, which
  # Claude Code, Codex, ChatGPT, Cursor, VS Code and Gemini CLI install from and the directories
  # track, as a commit and the same tag. The deploy key PLUGINS_DEPLOY_KEY may write there.
  agent-plugins:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-agent-plugins.mjs --url https://engenty.ai
      - uses: actions/upload-artifact@v7
        with:
          name: agent-plugins
          path: dist/agent-plugins-openai.zip
          if-no-files-found: error

      - name: Into engenty/wizards-plugins
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEPLOY_KEY: ${{ secrets.PLUGINS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::PLUGINS_DEPLOY_KEY is not set: engenty/wizards-plugins keeps its version"
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/plugins && chmod 600 ~/.ssh/plugins
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/plugins -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:engenty/wizards-plugins.git "$RUNNER_TEMP/plugins"
          cd "$RUNNER_TEMP/plugins"
          # The build is the whole repository: what it no longer writes goes.
          git rm -rq --ignore-unmatch . && cp -R "$GITHUB_WORKSPACE/dist/agent-plugins/." .
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q --allow-empty -m "release: $GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
          git push origin HEAD "$GITHUB_REF_NAME"

  # The installer, as a person runs it, with the package of this commit instead of the registry's:
  # its own Node, the runtime, the command, then a start that answers.
  installer:
    needs: [changes, package]
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/npm

      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck apps/web/public/install.sh

      - name: Install
        run: |
          set -euo pipefail
          export ENGENTY_HOME="$RUNNER_TEMP/engenty"
          runtime="$(ls "$PWD"/dist/npm/engenty-wizards-runtime-*.tgz)"
          ENGENTY_WIZARDS_PACKAGE="$runtime" bash apps/web/public/install.sh --yes --no-link
          {
            echo "ENGENTY_HOME=$ENGENTY_HOME"
            echo "RUNTIME_TGZ=$runtime"
            echo "LAUNCHER_TGZ=$(ls "$PWD"/dist/npm/wizards-*.tgz)"
          } >> "$GITHUB_ENV"

      - name: Start, enter, stop
        run: |
          set -euo pipefail
          wizards="$ENGENTY_HOME/wizards/bin/wizards"
          "$wizards" doctor
          "$wizards" start --no-open > start.log 2>&1 &
          for _ in $(seq 1 120); do grep -q "is running" start.log && break; sleep 0.5; done
          cat start.log
          # A ticket lets a browser into the runtime that runs: 302 to the studio.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$("$wizards" open --print)")" = 302
          "$wizards" stop

      # `npx wizards` downloads the launcher alone: no dependencies, well under a megabyte.
      - name: The launcher is small
        run: |
          set -euo pipefail
          test "$(wc -c < "$LAUNCHER_TGZ")" -lt 1048576
          test "$(tar -xzOf "$LAUNCHER_TGZ" package/package.json | jq '(.dependencies // {}) | length')" = 0

      # As `npx wizards` on a machine without an install: it installs and hands over.
      - name: The launcher installs and hands over
        run: |
          set -euo pipefail
          export ENGENTY_HOME="$RUNNER_TEMP/engenty-npx" ENGENTY_WIZARDS_NO_LINK=1
          export ENGENTY_WIZARDS_PACKAGE="$RUNTIME_TGZ"
          version="$(node -p "require('./package.json').version")"
          test "$(npx --yes --package="$LAUNCHER_TGZ" wizards --version)" = "$version"
          npx --yes --package="$LAUNCHER_TGZ" wizards doctor
          test -x "$ENGENTY_HOME/wizards/bin/wizards"

      # An update of 0.7.4 or older fetches `wizards`, now the launcher, into the install and
      # switches to it at the next start: the launcher brings the runtime and starts it.
      - name: An older install's update completes
        run: |
          set -euo pipefail
          export ENGENTY_WIZARDS_PACKAGE="$RUNTIME_TGZ" ENGENTY_WIZARDS_NO_LINK=1
          home="$ENGENTY_HOME/wizards"
          version="$(node -p "require('./package.json').version")"
          rm -rf "$home/runtime/$version"
          PATH="$home/tools/node/bin:$PATH" npm install --prefix "$home/runtime/$version" "$LAUNCHER_TGZ"
          ln -sfn "$version" "$home/runtime/current"
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$home/tools/node/bin/node" \
            "$home/runtime/current/node_modules/wizards/bin/wizards.mjs" > "$home/bin/wizards"
          "$home/bin/wizards" doctor
          test -f "$home/runtime/current/node_modules/@engenty/wizards-runtime/apps/runtime/dist/index.js"

  # The same on Windows, with install.ps1 in the Windows PowerShell that Windows ships.
  installer-windows:
    needs: [changes, package]
    if: needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: dist/npm

      - name: Install
        shell: powershell
        run: |
          $env:ENGENTY_HOME = Join-Path $env:RUNNER_TEMP "engenty"
          $env:ENGENTY_WIZARDS_PACKAGE = (Get-ChildItem dist\npm\engenty-wizards-runtime-*.tgz).FullName
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps\web\public\install.ps1 -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ENGENTY_HOME=$env:ENGENTY_HOME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Start, enter, stop
        shell: powershell
        run: |
          $wizards = Join-Path $env:ENGENTY_HOME "wizards\bin\wizards.cmd"
          & $wizards doctor
          & $wizards start -s --no-open
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:ENGENTY_HOME "wizards\logs\runtime.log"); exit 1 }
          # A ticket lets a browser into the runtime that runs: 302 to the studio.
          $link = (& $wizards open --print | Select-Object -Last 1).Trim()
          $code = curl.exe -s -o NUL -w "%{http_code}" $link
          & $wizards stop
          if ($code -ne "302") { Write-Error "open --print answered $code"; exit 1 }

  publish:
    needs: [package, installer, installer-windows, templates, runner, agent-plugins]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts/npm-package
      - uses: actions/download-artifact@v8
        with:
          name: templates
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: runner
          path: artifacts
      - uses: actions/download-artifact@v8
        with:
          name: agent-plugins
          path: artifacts
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: GitHub release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            artifacts/npm-package/*.tgz artifacts/templates.tgz artifacts/runner.tgz \
            artifacts/agent-plugins-openai.zip

      # The runtime first, the launcher once npm serves it: the launcher installs the runtime of
      # its own version from npm. @engenty/wizards needs neither.
      #
      # npm takes a few minutes to serve a version it accepted. Each package counts once `latest`
      # names it and its tarball downloads, so a green release means `npx wizards` and the updates
      # get it. It asks with a query of its own: npm's CDN keeps a 404 for five minutes, and one
      # for the plain address would turn away everyone who installs in that time.
      - name: npm
        if: vars.PUBLISH_NPM == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          q="release=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # served <name> <tarball file name>
          served() {
            for i in $(seq 1 60); do
              latest="$(curl -fsS "https://registry.npmjs.org/$1/latest?$q-$1-$i" | jq -r .version || true)"
              tarball="$(curl -s -o /dev/null -w '%{http_code}' \
                "https://registry.npmjs.org/$1/-/$2?$q-$1-$i" || true)"
              if [ "$latest" = "$version" ] && [ "$tarball" = 200 ]; then
                echo "npm serves $1@$version as latest"
                return 0
              fi
              echo "waiting for $1: latest is ${latest:-?}, the tarball answers $tarball"
              sleep 10
            done
            echo "::error::npm doesn't serve $1@$version as latest after 10 minutes"
            return 1
          }
          # publish <name> <file>: a version npm has already is left as it is, so a re-run after
          # npm refused one package (a 503 now and then) goes on with the ones that are missing.
          publish() {
            if npm view "$1@$version" version >/dev/null 2>&1; then
              echo "npm has $1@$version already"
            else
              npm publish "artifacts/npm-package/$2" --access public
            fi
          }
          publish @engenty/wizards-runtime "engenty-wizards-runtime-$version.tgz"
          served @engenty/wizards-runtime "wizards-runtime-$version.tgz"
          publish wizards "wizards-$version.tgz"
          served wizards "wizards-$version.tgz"
          publish @engenty/wizards "engenty-wizards-$version.tgz"
          served @engenty/wizards "wizards-$version.tgz"
