name: CI

# The checks of docs/development.md on every push to main, every pull request and every release
# tag. A push to main deploys nothing. On a release tag `v<version>` (pnpm release) the images of
# the cloud runtime and of the documentation are built here beside the checks and pushed to GHCR;
# when both are green the images become `latest` and the branches `deploy/runtime` and
# `deploy/docs` move to the tag's commit, each when what it is built from changed. The server
# deploys what a branch points at (Coolify resources `runtime` and `docs`, Auto Deploy) by pulling
# the images (compose.cloud.yaml, deploy/Dockerfile.docs): it builds nothing. No secret and no
# call to the server from here.
#   pnpm release                         # commit + tag vX.Y.Z, locally
#   git push origin main --follow-tags   # the tag is what deploys
# Run by hand on a tag (workflow_dispatch), it deploys that tag again.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # On main and on a tag a running check finishes, so every deploy is of a commit that passed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The checks run side by side, each on its own runner; deploy waits for all of them.
  verify:
    name: verify (${{ matrix.check }})
    # A release commit reaches main together with its tag: the tag's run checks that commit.
    if: >-
      ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every check runs to its end, so a failing one doesn't hide another.
      fail-fast: false
      matrix:
        check: [typecheck, test, build, docs]
    steps:
      - uses: actions/checkout@v7

      # Next.js' build cache for apps/docs (the pages live in docs/content). Without it the docs
      # build compiles everything from scratch, the longest part of it.
      - if: matrix.check == 'docs'
        uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'docs/content/**', '!apps/docs/.next/**', '!apps/docs/node_modules/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # The pnpm version is the `packageManager` of package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No cache of pnpm's store: restoring it (~1 GB) took as long as fetching the packages
          # from the registry.
          package-manager-cache: false

      # Only what the check needs: the docs site alone, or everything but the docs site.
      - name: Install
        run: >-
          pnpm install --frozen-lockfile
          --filter "${{ matrix.check != 'docs' && '!' || '' }}@engenty-wizards/docs"

      # How long each test file took last time: vitest starts the longest first, so
      # apps/runtime/test/sandbox.test.ts (half a minute) runs beside the others instead of
      # after them. Saved anew by every run, restored from the newest.
      - if: matrix.check == 'test'
        uses: actions/cache@v6
        with:
          path: |
            apps/runtime/node_modules/.vite/vitest
            packages/runner/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vitest-${{ runner.os }}-

      # Lint takes seconds: it rides along with the typecheck.
      - name: Lint
        if: matrix.check == 'typecheck'
        run: pnpm lint

      # The words people read: the mechanical rules of docs/copy-style.md.
      - name: Copy
        if: matrix.check == 'typecheck'
        run: pnpm copy:check --strict

      # The docs site is type-checked in its own check, where its packages are installed.
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: pnpm -r --filter "!@engenty-wizards/docs" typecheck

      - name: Test
        if: matrix.check == 'test'
        run: pnpm test

      - name: Build
        if: matrix.check == 'build'
        run: pnpm build

      # Every page names the release it describes, none a newer one (docs/development.md).
      - name: Docs versions
        if: matrix.check == 'docs'
        run: pnpm docs:check

      # The docs site (apps/docs, docs/content) is not part of the product's build.
      - name: Docs
        if: matrix.check == 'docs'
        run: pnpm --filter @engenty-wizards/docs typecheck && pnpm build:docs

  # The cloud runtime's two images and the documentation's, built on GitHub's runners: the server
  # only pulls them. The layers come from the registry's cache, so a release rebuilds only what
  # changed. Pushed under the tag; `latest` follows in `deploy`, once the checks are green too.
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: runtime
            file: apps/runtime/Dockerfile
          - image: browser
            file: deploy/Dockerfile.browser
          # The address the site is published at, for canonical links and link previews.
          - image: docs
            file: apps/docs/Dockerfile
            build-args: NEXT_PUBLIC_DOCS_SITE_URL=https://engenty.ai
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        timeout-minutes: 25
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/engenty/engenty-wizards-${{ matrix.image }}:buildcache,mode=max

  deploy:
    needs: [verify, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Every branch with its history: the step compares against the deploy branches.
          fetch-depth: 0

      - name: The tag is the version, on main
        run: |
          set -euo pipefail
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA^{commit}" origin/main

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # What the server pulls (compose.cloud.yaml, deploy/Dockerfile.docs): the release's images,
      # checked and built.
      - name: The release's images become latest
        run: |
          set -euo pipefail
          for image in runtime browser docs; do
            ref="ghcr.io/engenty/engenty-wizards-$image"
            docker buildx imagetools create --tag "$ref:latest" "$ref:$GITHUB_REF_NAME"
          done

      - name: Move the deploy branches
        run: |
          set -euo pipefail
          # The commit the tag points at.
          commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          # move <branch> <path>...: the paths are what the resource is built from.
          move() {
            local branch=$1
            shift
            if git rev-parse --quiet --verify "origin/$branch" >/dev/null; then
              if ! git merge-base --is-ancestor "origin/$branch" "$commit"; then
                echo "$branch is not behind this commit (moved by hand, or a newer run was first): left as it is."
                return
              fi
              if git diff --quiet "origin/$branch" "$commit" -- "$@"; then
                echo "$branch: nothing it is built from changed since $(git rev-parse --short "origin/$branch"): no deploy."
                return
              fi
            fi
            git push origin "$commit:refs/heads/$branch"
            echo "$branch now at $(git rev-parse --short "$commit"): the server deploys it."
          }
          # The runtime: compose.cloud.yaml with the two images (apps/runtime/Dockerfile,
          # deploy/Dockerfile.browser) built above.
          move deploy/runtime apps/runtime apps/web packages modules plugin \
            deploy/Dockerfile.browser deploy/browser-entrypoint.sh compose.cloud.yaml .dockerignore \
            package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json \
            ':(exclude)apps/runtime/test'
          # The documentation site: deploy/Dockerfile.docs with the image (apps/docs/Dockerfile)
          # built above. The root package.json is left out: its version changes with every
          # release, the site with its pages.
          move deploy/docs apps/docs docs/content docs/assets deploy/Dockerfile.docs \
            deploy/Dockerfile.docs.dockerignore pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json

      # A repository that builds on the release's images (its own image on top of the runtime's)
      # hears of it: a repository_dispatch `runtime-released` with the tag, to the repository named
      # in the variable RELEASE_DISPATCH_REPO, with a token that may write there in the secret
      # RELEASE_DISPATCH_TOKEN. Without the variable nothing is sent.
      - name: Tell the repository that builds on the release
        if: vars.RELEASE_DISPATCH_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          REPO: ${{ vars.RELEASE_DISPATCH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_DISPATCH_TOKEN is not set: $REPO is not told of $GITHUB_REF_NAME."
            exit 0
          fi
          gh api "repos/$REPO/dispatches" -f event_type=runtime-released \
            -f "client_payload[tag]=$GITHUB_REF_NAME"
          echo "$REPO told of $GITHUB_REF_NAME."
